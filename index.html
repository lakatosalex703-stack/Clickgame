<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickGame - Supabase</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #111; color: white; }
        .card { background: white; border: 1px solid #ddd; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 8px; color: #333; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { opacity: 0.9; }
        #game-section { display: none; }
        .click-btn { font-size: 24px; padding: 20px 40px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="auth-section" class="card">
        <h3>Regisztráció / Bejelentkezés</h3>
        <input type="email" id="email" placeholder="Email cím">
        <input type="password" id="password" placeholder="Jelszó">
        <br>
        <button id="register-btn" style="background: #2979ff; color: white;">Regisztráció</button>
        <button id="login-btn" style="background: #00c853; color: white;">Bejelentkezés</button>
        <p id="auth-message"></p>
    </div>

    <div id="game-section">
        <div class="card">
            <h1>ClickGame</h1>
            <p>Üdvözlet, <span id="user-email"></span>!</p>
            <h3>Egyenleg: <span id="balance" style="font-size: 40px; color: #2979ff;">0</span></h3>
            <button id="click-btn" class="click-btn" style="background: #00c853; color: white;">KATTINTÁS</button>
            <br>
            <button id="logout-btn" style="background: #e57373; color: white; margin-top: 20px;">Kijelentkezés</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ypaujxeiowceacykecwo.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_DERC1ZESHhAGXgFP7B9STw_ME-H5DMP"

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentBalance = 0;

         document.getElementById('register-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabase.auth.signUp({ email, password });
            const msg = document.getElementById('auth-message');
            if (error) {
                msg.style.color = "red";
                msg.innerText = error.message;
            else 
            document.getElementById('auth-section').style.display = 'none';
document.getElementById('game-section').style.display = 'block';
document.getElementById('user-email').innerText = email;
await loadUserData(data.user.id);

                msg.style.color = "green";
                msg.innerText = "Sikeres regisztráció! Kérlek, erősítsd meg az emailedet.";
            }
        });

        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            const msg = document.getElementById('auth-message');
            if (error) {
                msg.style.color = "red";
                msg.innerText = error.message;
            } else {
                currentUser = data.user;
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('game-section').style.display = 'block';
                document.getElementById('user-email').innerText = currentUser.email;
                await loadUserData(currentUser.id);
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            location.reload();
        });

        async function loadUserData(userId) {
            const { data, error } = await supabase
                .from('profiles')
                .select('balance')
                .eq('id', userId)
                .single();

            if (data) {
                currentBalance = data.balance;
                document.getElementById('balance').innerText = currentBalance;
            }
        }

        document.getElementById('click-btn').addEventListener('click', async () => {
            if (!currentUser) return;
            currentBalance += 1;
            document.getElementById('balance').innerText = currentBalance;

            await supabase
                .from('profiles')
                .update({ balance: currentBalance })
                .eq('id', currentUser.id);
        });
    </script>
</body>
</html>
